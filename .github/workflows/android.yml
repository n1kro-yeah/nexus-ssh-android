name: Android CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      NEXUS_STORE_PASSWORD: ${{ secrets.NEXUS_STORE_PASSWORD }}
      NEXUS_KEY_ALIAS: ${{ secrets.NEXUS_KEY_ALIAS }}
      NEXUS_KEY_PASSWORD: ${{ secrets.NEXUS_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Generate Gradle wrapper if missing
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.11.1
          fi
          chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Decode signing keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "${{ runner.temp }}/release.jks"
          echo "NEXUS_STORE_FILE=${{ runner.temp }}/release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: env.KEYSTORE_BASE64 != ''
        run: |
          ./gradlew --no-daemon --stacktrace assembleRelease \
            -PNEXUS_STORE_FILE="$NEXUS_STORE_FILE" \
            -PNEXUS_STORE_PASSWORD="$NEXUS_STORE_PASSWORD" \
            -PNEXUS_KEY_ALIAS="$NEXUS_KEY_ALIAS" \
            -PNEXUS_KEY_PASSWORD="$NEXUS_KEY_PASSWORD"

      - name: Build unsigned release APK
        if: env.KEYSTORE_BASE64 == ''
        continue-on-error: true
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Collect APKs
        run: |
          mkdir -p artifacts
          find app/build/outputs/apk -name '*.apk' -exec cp {} artifacts/ \;
          ls -lh artifacts

      - name: Upload APKs as build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nexus-ssh-apk
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Nexus SSH ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: artifacts/*.apk
